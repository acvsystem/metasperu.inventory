<div class="container-fluid p-43">
    <div class="row">
        <div style="width: 76%;">
            <div class="card shadow p-2">
                <h5>Productividad de Pockets</h5>
                <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'bar'">
                </canvas>
            </div>
        </div>

        <div style="width: 76%">
            <div class="card shadow p-3">
                <h5>Distribución por Sección</h5>
                <canvas baseChart [data]="pieChartData" [type]="'pie'">
                </canvas>
            </div>
        </div>
    </div>
</div>
