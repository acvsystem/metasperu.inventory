<ion-row
  ><ion-col size="12"
    ><button
      type="button"
      class="custom-item"
      (click)="openStoreModal()"
      [attr.aria-label]="label"
      aria-haspopup="dialog"
      [attr.aria-expanded]="isModalOpen"
    >
      <span class="selector-content"
        ><span class="selector-label">{{ label }}</span
        ><span class="selector-value">{{ selectedText || 'Seleccionar' }}</span></span
      ><span class="selector-chevron" aria-hidden="true">⌄</span>
    </button></ion-col
  ></ion-row
>

<ion-modal
  [isOpen]="isModalOpen"
  class="custom-dialog-modal mt-select"
  (didDismiss)="cancelSelection()"
  (didPresent)="onModalPresented()"
>
  <ng-template>
    <div class="dialog-container">
      <div class="dialog-header">
        <h2>{{ label }}</h2>
        <ion-searchbar
          placeholder="Filtrar..."
          aria-label="Buscar opciones"
          [debounce]="120"
          (ionInput)="handleFilter($event)"
          mode="md"
          class="custom-searchbar"
        >
        </ion-searchbar>
        <small class="option-count">{{ filteredData.length | number }} opciones</small>
      </div>

      <div class="dialog-body">
        <ion-list lines="none">
          @if (isMultiselect) {
            <ion-item class="selectable-item select-all-item">
              <ion-checkbox
                justify="start"
                labelPlacement="end"
                (ionChange)="setAllSelected($event)"
                [checked]="isAllSelected"
                [indeterminate]="isIndeterminate"
                mode="md"
              >
                Seleccionar todos</ion-checkbox
              >
            </ion-item>
          }

        </ion-list>
        @if (filteredData.length) {
          <cdk-virtual-scroll-viewport class="section-options" [itemSize]="44" [minBufferPx]="176" [maxBufferPx]="352"
            [style.height.px]="filteredData.length < 7 ? filteredData.length * 44 : 308" role="group" aria-label="Opciones disponibles">
            <div *cdkVirtualFor="let item of filteredData; trackBy: trackOption" class="virtual-option-row">
              @if (isMultiselect) {
                <ion-item class="selectable-item">
                  <ion-checkbox justify="start" labelPlacement="end" [checked]="!!item.selected"
                    (ionChange)="onCheckboxChange($event, item)" mode="md">{{ item.value }}</ion-checkbox>
                </ion-item>
              } @else {
                <ion-item button (click)="selectItem(item)" class="selectable-item notMultiselect">
                  <ion-label>{{ item.value }}</ion-label>
                </ion-item>
              }
            </div>
          </cdk-virtual-scroll-viewport>
        } @else { <div class="no-results">No se encontraron resultados</div> }

      </div>

      <div class="dialog-footer">
        <ion-button fill="clear" color="medium" (click)="cancelSelection()">CANCELAR</ion-button>
        <ion-button fill="clear" color="primary" (click)="confirmSelection()">ACEPTAR</ion-button>
      </div>
    </div>
  </ng-template>
</ion-modal>
