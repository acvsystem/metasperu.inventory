<label class="compact-field"
  ><span>{{ label }}</span>
  <input
    [id]="id"
    [type]="type === 'number' ? 'text' : type"
    [attr.inputmode]="type === 'number' ? 'numeric' : null"
    [(ngModel)]="autoText"
    (input)="onChange($event)"
    (keypress)="type === 'number' ? onlyNumbers($event) : null"
    [placeholder]="placeholder"
/></label>
