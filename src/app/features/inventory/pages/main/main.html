<ion-menu contentId="main-content">
    <ion-header>
        <ion-toolbar>
            <ion-title>Menú</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
        <div class="example-menu" *ngFor="let menu of menuFiltrado" cdkMenu>

            <ion-menu-toggle class="example-menu" auto-hide="true">
                <button class="menu-item" (click)="onNavigatorRoute(menu.ruta)" cdkMenuItem>
                    <span>{{menu.nombre_menu}}</span>
                </button>
            </ion-menu-toggle>

        </div>
    </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
    <ion-header>
        <ion-toolbar>
            <ion-buttons slot="start">
                <ion-menu-button></ion-menu-button>
            </ion-buttons>

            <ion-title class="app-title">METAS PERU</ion-title>

            <ion-buttons slot="end">
                <span class="toolbar-connection" [class.offline]="!isOnline()">
                    <ion-icon [name]="isOnline() ? 'wifi-outline' : 'cloud-offline-outline'"></ion-icon>
                    {{ isOnline() ? 'Conectado' : 'Sin conexión' }}
                </span>
                <ion-button id="profile-popover-trigger">
                    <ion-avatar class="avatar-header">
                        <img src="assets/metasicon.png" />
                    </ion-avatar>
                    <ion-icon name="chevron-down-outline" size="small"></ion-icon>
                </ion-button>
            </ion-buttons>
        </ion-toolbar>
    </ion-header>

    <ion-content>
        <router-outlet></router-outlet>
    </ion-content>
</div>

<ion-popover trigger="profile-popover-trigger" triggerAction="click" [dismissOnSelect]="true">
    <ng-template>
        <div class="user-popover-header ion-padding">
            <img src="assets/metasicon.png" width="24">
            <div class="user-info">
                <span class="label">{{userRole}}</span>
                <span class="name">{{ user() }}</span>
            </div>
        </div>

        <ion-list lines="full">
            <div class="profile-pocket-mode">
                <span>Funcionamiento Pocket</span>
                <div role="radiogroup" aria-label="Funcionamiento Pocket">
                    <label><input type="radio" name="profilePocketMode" [checked]="(pocketSettings.operationMode | async) === 'online'"
                        [disabled]="!pocketSettings.modeChangeAllowed()" (change)="pocketSettings.setOperationMode('online')">Online</label>
                    <label><input type="radio" name="profilePocketMode" [checked]="(pocketSettings.operationMode | async) === 'manual'"
                        [disabled]="!pocketSettings.modeChangeAllowed()" (change)="pocketSettings.setOperationMode('manual')">Manual</label>
                </div>
            </div>
            <ion-item button>
                <ion-icon slot="start" name="notifications-outline"></ion-icon>
                <ion-label>Notificaciones</ion-label>
            </ion-item>
            <ion-item button>
                <ion-icon slot="start" name="settings-outline"></ion-icon>
                <ion-label>Configuración cuenta</ion-label>
            </ion-item>
            <ion-item button (click)="logout()" detail="false" class="logout-btn">
                <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
                <ion-label color="danger">Cerrar sesión</ion-label>
            </ion-item>
        </ion-list>
    </ng-template>
</ion-popover>

<toas-notification></toas-notification>
